<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030712">
<title>Asp.AM | Preset Archive</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@400;600;700;900&display=swap');

:root {
  --blue: #38bdf8;
  --bright: #00aaff;
  --dark: #030712;
  --card: rgba(8, 19, 39, 0.8);
  --border: rgba(56, 189, 248, 0.2);
  --text: #e8f4ff;
  --muted: #8294ad;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, #0b326055, transparent 60%),
    radial-gradient(ellipse at 90% 90%, #001d4055, transparent 50%);
  pointer-events: none;
  z-index: -2;
}

/* ANIMATED BACKGROUND */

#particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: #38bdf8;
  border-radius: 50%;
  box-shadow: 0 0 12px #00aaff;
  animation: float linear infinite;
}

@keyframes float {
  from {
    transform: translateY(110vh);
    opacity: 0;
  }
  20% { opacity: .8; }
  80% { opacity: .8; }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}

/* ENTRANCE */

#entrance {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #030712;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .8s, visibility .8s;
}

#entrance.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.enter-content {
  text-align: center;
  padding: 25px;
}

.enter-symbol {
  font-size: 65px;
  margin-bottom: 25px;
  filter: drop-shadow(0 0 25px #00aaff);
  animation: pulse 3s infinite;
}

@keyframes pulse {
  50% {
    filter: drop-shadow(0 0 50px #00aaff);
    transform: scale(1.08);
  }
}

.enter-title {
  font-family: Orbitron, sans-serif;
  font-size: clamp(45px, 10vw, 95px);
  font-weight: 900;
  letter-spacing: 8px;
  background: linear-gradient(120deg, #fff, #38bdf8, #0066ff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 70px #0088ff55;
}

.enter-subtitle {
  color: var(--muted);
  letter-spacing: 5px;
  font-size: 11px;
  margin: 20px 0 45px;
}

.enter-btn {
  background: transparent;
  border: 1px solid var(--blue);
  color: var(--blue);
  padding: 17px 55px;
  border-radius: 8px;
  cursor: pointer;
  font-family: Orbitron;
  letter-spacing: 3px;
  transition: .3s;
  box-shadow: 0 0 25px #0088ff33;
}

.enter-btn:hover {
  background: var(--blue);
  color: #000;
  box-shadow: 0 0 45px #00aaff;
}

/* MAIN WEBSITE */

#app {
  opacity: 0;
  transform: translateY(20px);
  transition: 1s;
}

#app.visible {
  opacity: 1;
  transform: translateY(0);
}

.container {
  width: min(1100px, 92%);
  margin: auto;
}

/* NAVBAR */

nav {
  height: 85px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: Orbitron;
  font-size: 23px;
  font-weight: 900;
  color: white;
}

.logo span {
  color: var(--blue);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.status {
  color: #67e8f9;
  font-size: 11px;
  letter-spacing: 2px;
}

.music-btn {
  border: 1px solid var(--border);
  background: #0b1729;
  color: var(--blue);
  padding: 11px 15px;
  border-radius: 8px;
  cursor: pointer;
}

/* HERO */

.hero {
  text-align: center;
  padding: 95px 15px 65px;
}

.badge {
  display: inline-block;
  border: 1px solid var(--border);
  background: #08172a;
  color: var(--blue);
  padding: 9px 18px;
  border-radius: 30px;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.hero h1 {
  font-family: Orbitron;
  font-size: clamp(38px, 8vw, 78px);
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(120deg, white, #38bdf8, #0066ff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  color: var(--muted);
  margin-top: 22px;
  line-height: 1.8;
}

.hero-line {
  height: 2px;
  width: 120px;
  margin: 35px auto;
  background: var(--blue);
  box-shadow: 0 0 25px var(--blue);
}

/* STATS */

.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 55px;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 35px;
  text-align: center;
  min-width: 145px;
}

.stat strong {
  display: block;
  font-family: Orbitron;
  color: var(--blue);
  font-size: 25px;
}

.stat span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 8px;
  letter-spacing: 2px;
}

/* SEARCH */

.search-area {
  margin-bottom: 30px;
}

.search-box {
  width: 100%;
  padding: 20px 23px;
  border-radius: 12px;
  background: #081426;
  border: 1px solid var(--border);
  outline: none;
  color: white;
  font-size: 15px;
  transition: .3s;
}

.search-box:focus {
  border-color: var(--blue);
  box-shadow: 0 0 30px #0088ff22;
}

.search-box::placeholder {
  color: #64748b;
}

/* FILTERS */

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 35px;
}

.filter {
  background: #091629;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 11px 20px;
  border-radius: 8px;
  cursor: pointer;
  transition: .25s;
  text-transform: capitalize;
}

.filter:hover,
.filter.active {
  background: #0b3150;
  color: var(--blue);
  border-color: var(--blue);
}

/* PRESET CARDS */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 20px;
  margin-bottom: 100px;
}

.card {
  background: linear-gradient(145deg, #0b1b31, #050c19);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 25px;
  position: relative;
  overflow: hidden;
  transition: .35s;
}

.card::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  background: #0088ff22;
  filter: blur(60px);
  top: -80px;
  right: -80px;
}

.card:hover {
  transform: translateY(-8px);
  border-color: var(--blue);
  box-shadow: 0 15px 45px #0088ff22;
}

.card-icon {
  width: 55px;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #102a46;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 26px;
  margin-bottom: 22px;
}

.card-category {
  color: var(--blue);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 2px;
}

.card h3 {
  font-size: 19px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 25px;
}

.card a {
  display: block;
  text-align: center;
  padding: 13px;
  background: #0b3150;
  border: 1px solid #1d608c;
  border-radius: 8px;
  color: #7dd3fc;
  text-decoration: none;
  font-weight: 700;
  transition: .25s;
}

.card a:hover {
  background: var(--blue);
  color: #000;
  box-shadow: 0 0 25px #0088ff55;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 60px 20px;
  grid-column: 1 / -1;
}

/* MUSIC PANEL */

.music-panel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 50;
  background: #071426ee;
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 0 30px #0088ff22;
}

.music-panel button {
  background: #103653;
  color: var(--blue);
  border: 1px solid var(--border);
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.music-panel input {
  width: 75px;
  accent-color: var(--blue);
}

footer {
  text-align: center;
  padding: 35px 10px 110px;
  color: #53647c;
  font-size: 12px;
  letter-spacing: 2px;
  border-top: 1px solid var(--border);
}

@media(max-width: 600px) {
  nav { height: 70px; }
  .logo { font-size: 18px; }
  .status { display: none; }
  .hero { padding-top: 70px; }
  .stat { min-width: 120px; padding: 17px; }
  .music-panel { bottom: 12px; right: 12px; }
}
</style>
</head>

<body>

<div id="particles"></div>

<!-- ENTRANCE -->
<div id="entrance">
  <div class="enter-content">
    <div class="enter-symbol">🐺</div>
    <h1 class="enter-title">ASP.AM</h1>
    <p class="enter-subtitle">THE SHADOW PRESET ARCHIVE</p>
    <button class="enter-btn" id="enterBtn">
      ENTER ARCHIVE ↗
    </button>
  </div>
</div>

<!-- WEBSITE -->
<div id="app">

<div class="container">

<nav>
  <div class="logo">ASP<span>.AM</span></div>

  <div class="nav-right">
    <span class="status">● ARCHIVE ONLINE</span>
    <button class="music-btn" id="navMusic">♫ MUSIC</button>
  </div>
</nav>

<section class="hero">
  <div class="badge">🐺 THE SHADOW ARCHIVE</div>

  <h1>ASP.AM</h1>

  <p>
    The ultimate collection of Alight Motion presets.<br>
    Created for editors. Built in the shadows.
  </p>

  <div class="hero-line"></div>
</section>

<div class="stats">
  <div class="stat">
    <strong id="totalCount">0</strong>
    <span>PRESETS</span>
  </div>

  <div class="stat">
    <strong id="categoryCount">0</strong>
    <span>CATEGORIES</span>
  </div>

  <div class="stat">
    <strong>∞</strong>
    <span>POSSIBILITIES</span>
  </div>
</div>

<div class="search-area">
  <input
    class="search-box"
    id="search"
    placeholder="⌕ Search the archive..."
    autocomplete="off"
  >
</div>

<div class="filters" id="filters"></div>

<div class="grid" id="grid">
  <div class="empty">Loading presets...</div>
</div>

</div>

<footer>
  ASP.AM © 2026 — THE SHADOW ARCHIVE
</footer>

</div>

<!-- MUSIC -->
<div class="music-panel" id="musicPanel" hidden>
  <button id="playPause">Ⅱ</button>
  <span style="font-size:12px;color:#7dd3fc">♫ MUSIC</span>
  <input
    type="range"
    id="volume"
    min="0"
    max="1"
    step="0.01"
    value="0.35"
    aria-label="Music volume"
  >
</div>

<audio id="audio" src="music.mp3" loop preload="none"></audio>

<script>

/* PARTICLES */

const particleContainer = document.getElementById("particles");

for (let i = 0; i < 45; i++) {
  const particle = document.createElement("div");
  particle.className = "particle";

  particle.style.left = Math.random() * 100 + "%";
  particle.style.animationDuration = (8 + Math.random() * 12) + "s";
  particle.style.animationDelay = (-Math.random() * 20) + "s";
  particle.style.opacity = Math.random();

  particleContainer.appendChild(particle);
}

/* MUSIC */

const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const musicPanel = document.getElementById("musicPanel");
const volume = document.getElementById("volume");

audio.volume = 0.35;

function updateMusicButton() {
  playPause.textContent = audio.paused ? "▶" : "Ⅱ";
}

async function toggleMusic() {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      console.warn("Music could not play:", error);
    }
  } else {
    audio.pause();
  }

  updateMusicButton();
}

playPause.addEventListener("click", toggleMusic);
document.getElementById("navMusic").addEventListener("click", toggleMusic);

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("play", updateMusicButton);
audio.addEventListener("pause", updateMusicButton);

/* ENTER */

document.getElementById("enterBtn").addEventListener("click", async () => {
  document.getElementById("entrance").classList.add("hidden");
  document.getElementById("app").classList.add("visible");
  musicPanel.hidden = false;

  try {
    await audio.play();
  } catch (error) {
    console.warn("Add music.mp3 to enable music.");
  }

  updateMusicButton();
});

/* PRESETS */

let presets = [];
let activeCategory = "all";

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
const search = document.getElementById("search");

function createCard(preset) {
  const card = document.createElement("article");
  card.className = "card";

  const icon = document.createElement("div");
  icon.className = "card-icon";
  icon.textContent = preset.icon || "💙";

  const category = document.createElement("div");
  category.className = "card-category";
  category.textContent = preset.category || "preset";

  const title = document.createElement("h3");
  title.textContent = preset.title || "Untitled Preset";

  const description = document.createElement("p");
  description.textContent = preset.description || "Alight Motion Preset";

  const link = document.createElement("a");
  link.textContent = "GET PRESET ↗";
  link.target = "_blank";
  link.rel = "noopener noreferrer";

  try {
    const url = new URL(preset.url);
    if (!["https:", "http:"].includes(url.protocol)) {
      throw new Error("Invalid protocol");
    }
    link.href = url.href;
  } catch {
    link.removeAttribute("href");
    link.textContent = "LINK UNAVAILABLE";
  }

  card.append(icon, category, title, description, link);

  return card;
}

function renderPresets() {
  const query = search.value.trim().toLowerCase();

  const results = presets.filter(preset => {
    const matchesCategory =
      activeCategory === "all" ||
      (preset.category || "other").toLowerCase() === activeCategory;

    const searchable = [
      preset.title,
      preset.description,
      preset.category
    ].join(" ").toLowerCase();

    return matchesCategory && searchable.includes(query);
  });

  grid.replaceChildren();

  if (results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "🐺 No presets found in the shadows.";
    grid.appendChild(empty);
    return;
  }

  results.forEach(preset => {
    grid.appendChild(createCard(preset));
  });
}

function renderFilters() {
  const categories = [
    ...new Set(
      presets.map(p => (p.category || "other").toLowerCase())
    )
  ].sort();

  document.getElementById("totalCount").textContent = presets.length;
  document.getElementById("categoryCount").textContent = categories.length;

  filters.replaceChildren();

  ["all", ...categories].forEach(category => {
    const button = document.createElement("button");

    button.className =
      "filter" + (activeCategory === category ? " active" : "");

    button.textContent =
      category === "all" ? "ALL PRESETS" : category;

    button.addEventListener("click", () => {
      activeCategory = category;
      renderFilters();
      renderPresets();
    });

    filters.appendChild(button);
  });
}

async function loadPresets() {
  try {
    const response = await fetch("links.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Could not load links.json");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("links.json must be an array");
    }

    presets = data.filter(item =>
      item &&
      typeof item === "object" &&
      typeof item.url === "string"
    );

    renderFilters();
    renderPresets();

  } catch (error) {
    grid.replaceChildren();

    const message = document.createElement("div");
    message.className = "empty";
    message.textContent =
      "Could not load presets. Check that links.json contains valid JSON.";

    grid.appendChild(message);
    console.error(error);
  }
}

search.addEventListener("input", renderPresets);

loadPresets();

</script>

</body>
</html>
